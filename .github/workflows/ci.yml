name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run validation gate
        run: python test.py

      - name: Check JS syntax (all runtime files, incl. ESM)
        run: |
          set -euo pipefail
          find js -name '*.js' ! -name 'shell.js' -print0 | xargs -0 -n1 node --check
          node --input-type=module --check < js/shell.js
          if [ -f sw.js ]; then node --check sw.js; fi
