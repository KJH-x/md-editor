<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>md-editor — Markdown Editor</title>
  <link rel="stylesheet" href="https://unpkg.com/vditor/dist/index.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="vditor"></div>
  <input type="file" id="file-input" accept=".md,.markdown,.txt" hidden>
  <div class="file-toolbar">
    <button id="btn-open" title="打开 Markdown 文件" aria-label="打开文件">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button id="btn-save" title="保存为 Markdown 文件" aria-label="保存文件">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    </button>
    <span class="file-toolbar__sep"></span>
    <input type="number" id="input-pagewidth" placeholder="max-width" title="编辑区最大宽度 (px)" aria-label="编辑区最大宽度">
  </div>
  <div class="editor-brand">md-editor · Powered by Vditor</div>
  <script src="https://unpkg.com/vditor/dist/index.min.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/file-io.js"></script>
</body>
</html>
