<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="支持本地草稿、文件打开与导出的 Markdown 多标签编辑器">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)">
  <title data-i18n="app.title">md-editor — Markdown Editor</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="vendor/vditor/dist/images/logo.png" type="image/png">
  <link rel="stylesheet" href="vendor/dockview/dockview.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="shell">
  <header id="topbar">
    <span class="shell-brand" data-i18n="brand">md-editor · Powered by Vditor</span>
    <button type="button" id="new-tab" data-i18n="shell.newTab">新建标签</button>
    <span id="tab-count" role="status" aria-label="tab count"></span>
  </header>
  <div id="dockview-container"></div>
  <div id="shortcut-overlay" hidden role="dialog" aria-modal="true" aria-label="快捷键">
    <div class="shortcut-overlay__backdrop"></div>
    <div class="shortcut-overlay__panel" tabindex="-1">
      <h2 class="shortcut-overlay__title" data-i18n="overlay.title">快捷键</h2>
      <table class="shortcut-overlay__table">
        <tbody>
          <tr><td><kbd>Ctrl+T</kbd></td><td data-i18n="overlay.s.newTab">新建标签页</td></tr>
          <tr><td><kbd>Ctrl+W</kbd></td><td data-i18n="overlay.s.closeTab">关闭当前标签页</td></tr>
          <tr><td><kbd>Ctrl+Tab</kbd></td><td data-i18n="overlay.s.nextTab">切换到下一个标签页</td></tr>
          <tr><td><kbd>⌘S</kbd></td><td data-i18n="overlay.s.saveNow">立即保存草稿</td></tr>
          <tr><td><kbd>⌘O</kbd></td><td data-i18n="overlay.s.open">打开 Markdown 文件</td></tr>
          <tr><td><kbd>Ctrl+K</kbd></td><td data-i18n="overlay.s.palette">打开命令面板</td></tr>
          <tr><td><kbd>?</kbd></td><td data-i18n="overlay.s.togglePanel">显示 / 隐藏本快捷键面板</td></tr>
          <tr><td><kbd>Esc</kbd></td><td data-i18n="overlay.s.closePanel">关闭本快捷键面板</td></tr>
        </tbody>
      </table>
      <button type="button" class="shortcut-overlay__close" data-i18n="overlay.close">关闭</button>
    </div>
  </div>
  <noscript data-i18n="noscript">此编辑器需要启用 JavaScript。</noscript>
  <div id="statusbar" role="status" aria-live="polite">
    <span class="statusbar__seg" id="statusbar-docs"></span>
    <span class="statusbar__seg" id="statusbar-save"><span class="statusbar__dot"></span><span class="statusbar__save-text"></span></span>
    <span class="statusbar__seg" id="statusbar-lang"></span>
    <span class="statusbar__seg statusbar__hint" data-i18n="statusbar.shellHint">Ctrl+T 新建 · Ctrl+W 关闭 · Ctrl+S 保存</span>
  </div>
  <script src="js/i18n/zh-CN.js"></script>
  <script src="js/i18n/en-US.js"></script>
  <script src="js/i18n/es-ES.js"></script>
  <script src="js/i18n/hi-IN.js"></script>
  <script src="js/i18n/ar-AR.js"></script>
  <script src="js/i18n/index.js"></script>
  <script src="js/tab-store.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/file-io.js"></script>
  <script src="js/fsa.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/command-palette.js"></script>
  <script src="js/sw-register.js"></script>
  <script type="module" src="js/shell.js"></script>
</body>
</html>
