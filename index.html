<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="支持本地草稿、文件打开与导出的 Markdown 编辑器">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)">
  <title>md-editor — Markdown Editor</title>
  <link rel="icon" href="vendor/vditor/dist/images/logo.png" type="image/png">
  <link rel="stylesheet" href="vendor/vditor/dist/index.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="empty-state" hidden>
    <h2>开始写作</h2>
    <p class="empty-state__hint">选择一个模板快速开始，或直接输入内容。</p>
    <ul class="empty-state__templates">
      <li><a href="#">README</a></li>
      <li><a href="#">会议记录</a></li>
      <li><a href="#">待办清单</a></li>
    </ul>
    <p class="empty-state__shortcuts"><kbd>Alt+Ctrl+7</kbd> WYSIWYG · <kbd>Alt+Ctrl+8</kbd> IR · <kbd>Alt+Ctrl+9</kbd> SV</p>
  </div>
  <div id="vditor"></div>
  <div class="save-status" id="saveStatus" role="status" aria-live="polite"></div>
  <div class="editor-brand">md-editor · Powered by Vditor</div>
  <noscript>此编辑器需要启用 JavaScript。</noscript>
  <script src="vendor/vditor/dist/js/icons/ant.js" id="vditorIconScript"></script>
  <script src="vendor/vditor/dist/index.min.js"></script>
  <script src="js/file-io.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
